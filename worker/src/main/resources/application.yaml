spring:
  application:
    name: replay-to-repair-worker
  # Temporal worker: @WorkflowImpl classes are not beans and are discovered by
  # scanning the packages below; @ActivityImpl beans come from the application
  # context. Task queues are derived from both annotations.
  temporal:
    connection:
      target: ${TEMPORAL_ADDRESS:localhost:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    workers-auto-discovery:
      workflow-packages:
        - io.temporal.demos.replaytorepair.worker.triage
      register-activity-beans: true
  # Anthropic (Claude) via Spring AI powers the owner-selection Activity on
  # every profile other than jev, so ANTHROPIC_API_KEY is required there. The
  # jev profile selects the Jev engine instead, which reaches TypeSafe's
  # System One API through the spring-ai-starter-typesafe starter, and does
  # not read this section: its settings live under spring.ai.typesafe.* in
  # application-jev.yaml.
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      # Turn off the Anthropic SDK's own retry (default 2): Temporal's Activity
      # retry policy is the only retry in this system, and a second retry layer
      # underneath it would obscure how many attempts a triage actually took.
      max-retries: 0
      # A 20s call timeout stays inside the Activity's 30s start-to-close
      # timeout (IssueTriageWorkflowImpl), so a stalled LLM call fails here
      # with a cause that names the real problem instead of an opaque
      # ActivityTaskTimedOut from Temporal's own deadline.
      timeout: 20s
      chat:
        model: ${ANTHROPIC_MODEL:claude-sonnet-5}

# SkillsTool scans this location for <skill-name>/SKILL.md subfolders and
# exposes each skill to the LLM as a tool (here: the issue-triage skill).
triage:
  skills:
    location: classpath:/skills

# The worker serves no application HTTP of its own, so the spring-web connector
# takes an ephemeral port that nothing ever connects to: it is neither mapped
# nor documented.
server:
  port: 0

# Emit ECS-structured console logs so the worker matches the backend.
logging:
  structured:
    format:
      console: ecs

# Actuator listens on a port of its own and publishes the application's metrics
# there: 8080 is the gateway and 8081 the local dev backend, which runs on the
# host alongside the worker. Every meter has a plain reading under
# /actuator/metrics, and the whole registry is scraped at /actuator/prometheus,
# which serves the Prometheus text format and OpenMetrics alike through content
# negotiation (Accept: application/openmetrics-text).
management:
  server:
    port: ${WORKER_MANAGEMENT_PORT:8082}
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  # Histogram buckets for triage.owner.selection, instead of percentiles
  # computed inside the worker: buckets add up across processes, so p50/p95 hold
  # with several workers running at once, computed server-side with e.g.
  # histogram_quantile(0.95, sum by (le, engine) (rate(triage_owner_selection_seconds_bucket[5m]))).
  # The bounds decide how many buckets a scrape carries, and 100ms-30s frames
  # the range a selection call falls in: the HTTP client budget is 20s and the
  # Activity's start-to-close timeout 30s.
  metrics:
    distribution:
      percentiles-histogram:
        "[triage.owner.selection]": true
      minimum-expected-value:
        "[triage.owner.selection]": 100ms
      maximum-expected-value:
        "[triage.owner.selection]": 30s
