# Orchestrates the containerized parts of the demo: Temporal dev server, the
# backend REST API, the Caddy gateway, and the Markdown renderer that works
# around a Web UI defect. The worker is deliberately NOT here — it runs
# locally (`make dev`) so it can be rebuilt and restarted quickly during the
# live demo.
services:
  # Temporal dev server — local development ONLY, never production.
  # Single process with a built-in database and Web UI. The UI is served through
  # the gateway at /temporal (http://localhost:8080/temporal), not a direct port.
  temporal:
    image: temporalio/temporal:latest
    command:
      - server
      - start-dev
      - --ip
      - 0.0.0.0
      - --ui-public-path
      - /temporal
    ports:
      - "${TEMPORAL_GRPC_PORT:-7233}:7233"  # gRPC endpoint for workers and clients
    healthcheck:
      test: ["CMD-SHELL", "temporal operator cluster health"]
      interval: 10s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    restart: unless-stopped

  # WORKAROUND for an upstream Web UI defect, not a design choice: the Web UI
  # renders a workflow's static summary and details in an iframe pointing at
  # its own server-side Markdown route, /render, and that route is not
  # registered under --ui-public-path. Behind /temporal it answers the SPA
  # shell instead, so the User Metadata tab shows two empty boxes. This is the
  # same Web UI as the one the dev server bundles, served at the root, where
  # /render works; the gateway routes only /temporal/render* here. Pending an
  # upstream fix — this service and the gateway route both go away once the Web
  # UI serves /render under its public path.
  # Markdown rendering is all this serves: it is not a second cluster, and it
  # points at the dev server only because the Web UI expects a cluster address.
  markdown-renderer:
    image: temporalio/ui:latest
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  # REST API consumed by the frontend. Reachable only through the gateway.
  backend:
    build: ./backend
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_NAMESPACE: default
      PORT: "8080"
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512M
    restart: on-failure

  # Caddy: serves the static frontend and reverse-proxies /api/* to the backend
  # and /temporal to the Temporal Web UI.
  # BACKEND_UPSTREAM lets `make dev` point the gateway at a locally-run backend
  # instead of the backend container.
  # The gateway is the ONLY container that must reach back to the host — the
  # locally-run backend in `make dev`. Docker maps host.docker.internal via the
  # host-gateway entry (required on Docker Engine/Linux, harmless on Docker
  # Desktop). Podman provides host.containers.internal natively, so on Podman
  # the Makefile overrides GATEWAY_HOST_MAPPING with a harmless placeholder to
  # avoid Podman rootless's host-gateway resolution error. With no env set the
  # default is the Docker behavior, so `docker compose ...` works directly.
  # No hard depends_on: the gateway starts even when the backend is absent
  # (dev) or not yet ready — Caddy simply returns 502 until the upstream is up.
  gateway:
    image: caddy:2-alpine
    ports:
      - "${GATEWAY_PORT:-8080}:80"  # single entry point — http://localhost:8080
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv:ro
    extra_hosts:
      - "${GATEWAY_HOST_MAPPING:-host.docker.internal:host-gateway}"
    environment:
      BACKEND_UPSTREAM: ${BACKEND_UPSTREAM:-backend:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 3
    restart: unless-stopped
